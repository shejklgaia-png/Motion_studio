name: Android APK - Motion Studio

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK (Godot 4.6)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Download Godot editor and export templates
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip -q templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"

      - name: Configure debug signing and export paths
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Parse and import Godot project
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Test bbmodel import and animation
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_bbmodel.gd

      - name: Test mobile UI layout and navigation
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_mobile_ui.gd

      - name: Test joint gizmo, camera and flat shading
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_gizmo.gd

      - name: Test IK/FK baking, restore, and .tres export
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_bake.gd

      - name: Test exported .tres animation matches baked joint transforms
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_export_audit.gd

      - name: Test preview overlay, file menu and touch gestures
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_touch_layout.gd

      - name: Test Blockbench inspired UI and preserved features
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_blockbench_workspace.gd

      - name: Test beginner friendly UI and feature retention
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_clarity_ui.gd

      - name: Test analytic two-bone IK, pole control and bake
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_analytic_ik.gd

      - name: Test touch editing of IK goals
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_ik_touch.gd

      - name: Test touch timeline drag and editing usability
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_key_timeline_ux.gd

      - name: Test contact anchors and deterministic IK baking
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_contact_roadmap.gd

      - name: Test touch UI for contact anchors
        run: |
          timeout 25s ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_contact_ui.gd

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --export-debug Android build/MotionStudio-debug.apk

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionStudio-Android-debug
          path: build/MotionStudio-debug.apk
          if-no-files-found: error
      - name: Motion project corruption and backup recovery regression
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/test_project_storage_recovery.gd
